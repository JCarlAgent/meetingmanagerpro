
[functions.check-weather-alerts]
enabled = true
verify_jwt = true
import_map = "./functions/check-weather-alerts/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/check-weather-alerts/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/check-weather-alerts/*.html" ]

[functions.gemini-optimizer]
enabled = true
verify_jwt = false

